{% extends 'base.html' %}
{% block title %}Eliminar Ciclo | PreVirtual{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16 bg-white shadow border border-gray-250 rounded-xl p-8 text-center">
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
        <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>
    <h3 class="text-xl font-bold text-gray-900 mb-2">¿Eliminar ciclo?</h3>
    <p class="text-gray-500 mb-6">Esta acción es irreversible y eliminará todos los módulos y recursos asociados a este ciclo.</p>
    
    <form method="POST" class="flex gap-3">
        {% csrf_token %}
        <a href="{% url 'curriculo:programa_list' %}" class="flex-1 bg-white border border-gray-300 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-50 text-sm">Cancelar</a>
        <button type="submit" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-lg hover:bg-red-700 text-sm">Eliminar</button>
    </form>
</div>
{% endblock %}
